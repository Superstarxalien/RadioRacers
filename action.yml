name: "Setup osxcross"
author: mbround18
description: Setup osxcross for rust/other compilation projects.
branding:
  icon: 'aperture'  
  color: 'green'

inputs:
  osx-version:
    description: "Version of osx to use."
    required: true

runs:
  using: "composite"
  steps:
    - shell: bash
      name: Check system
      run: |
        if [[ "$OSTYPE" == "linux-gnu"* ]]; then
          echo "Found linux based system, proceeding."
          if [ -z "${{ inputs.osx-version }}" ]; then
            echo "Error!: Osx Version required!"
            exit 1
          fi
        else
          echo "Error!: Your system must be a linux based system! Try running this on ubuntu-latest."
          exit 1
        fi

    - shell: bash
      run: mkdir -p $GITHUB_ACTION_PATH/osxcross

    - shell: bash
      id: target
      run: |
        repeat(){
          for i in {1..90}; do echo -n "$1"; done
        }

        echo "::group::Disclaimer Click Here for Info"
        echo ""
        repeat "-"
        echo ""
        echo "The first time you run this it will take upwards of 9 minutes to compile. Subsequent builds are cached."
        echo ""
        repeat "-"
        echo ""
        echo "::endgroup::"


        echo "::group::Installing Deps"

        if hash sudo 2>/dev/null; then
          sudo dpkg --add-architecture arm64

          sudo tee /etc/apt/sources.list.d/arm64-cross.sources <<-EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: jammy jammy-updates
          Components: main restricted universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
          bash \
          binutils-multiarch-dev \
          build-essential \
          ca-certificates \
          clang \
          g++ \
          ccache \
          nasm \
          lld \
          ninja-build \
          cmake \
          git \
          libbz2-dev \
          libmpc-dev \
          libmpfr-dev \
          libgmp-dev \
          liblzma-dev \
          libpsi3-dev \
          libssl-dev \
          libxml2-dev \
          libz-dev \
          llvm-dev \
          lzma-dev \
          make \
          patch \
          python3 \
          uuid-dev \
          wget \
          xz-utils \
          bzip2 \
          openssl \
          patch \
          zlib1g-dev
          sudo apt-get install apt-utils
          sudo apt-get install auto-apt-proxy
          sudo apt-get upgrade tzdata
          sudo apt-get install g++-aarch64-linux-gnu
          sudo apt-get install \
          libcurl4-openssl-dev:arm64 \
          libgme-dev:arm64 \
          libibus-1.0-dev:arm64 \
          libjack-dev:arm64 \
          libltdl-dev:arm64 \
          libminiupnpc-dev:arm64 \
          libopenmpt-dev:arm64 \
          libpng-dev:arm64 \
          libsdl2-dev:arm64 \
          libsdl2-mixer-dev:arm64 \
          libvorbis-dev:arm64 \
          libvpx-dev:arm64 \
          libyuv-dev:arm64
          sudo apt-get install \
          autoconf \
          autopoint \
          bison \
          curl \
          jq \
          libssl-dev \
          libtool \
          libunwind-dev \
          python3-jinja2 \
          tar \
          unzip \
          zip
          sudo apt-get upgrade
        fi
        echo "::endgroup::"

        OSXCROSS_FOLDER="$(echo "$GITHUB_ACTION_PATH/osxcross" | sed 's/\.\/*//g')"

        echo "::group::Cloning osxcross"
        git clone https://github.com/tpoechtrager/osxcross "$OSXCROSS_FOLDER"
        echo "::endgroup::"

          

        # Check setup for osx version
        echo "::group::Fetching macosx SDK"
        FILE_NAME="MacOSX${{ inputs.osx-version }}.sdk.tar.xz"

        # Check joseluisq/macosx-sdks for release
        wget -nc "https://github.com/joseluisq/macosx-sdks/releases/download/${{ inputs.osx-version }}/${FILE_NAME}" -O "$OSXCROSS_FOLDER/tarballs/${FILE_NAME}"
        echo "::endgroup::"

    - uses: actions/cache@v3
      id: cache
      with:
        key: ${{ runner.os }}-osxcross-${{ inputs.osx-version }}
        path: |
          ${{ env.OSXCROSS_FOLDER }}/target/bin
          

    - shell: bash
      if: steps.cache.outputs.cache-hit != 'true'
      env:
        SDK_VERSION: "${{ inputs.osx-version }}"
        UNATTENDED: "yes"
      run: |
        cd "$GITHUB_ACTION_PATH/osxcross"
        bash ./build.sh

    - shell: bash
      run: |
        echo "::group::Setting up Bin files"
        OSXCROSS_FOLDER="$(echo "$GITHUB_ACTION_PATH/osxcross" | sed 's/\.\/*//g')"
        echo "OSXCROSS Folder = ${OSXCROSS_FOLDER}"

        if [ ! -d "$OSXCROSS_FOLDER/target/bin" ]; then
          echo "Error! Failed to find ${OSXCROSS_FOLDER}/target/bin folder!"
          exit 1
        else
          if hash sudo 2>/dev/null; then
            sudo chmod +x $OSXCROSS_FOLDER/target/bin/*
          else
            chmod +x $OSXCROSS_FOLDER/target/bin/*
          fi    
        fi
          
        echo "::endgroup::"

        echo "::group::Finding Executables"
        echo "$OSXCROSS_FOLDER/target/bin" >> $GITHUB_PATH
        findTarget() {
          local file="$(find "$OSXCROSS_FOLDER/target/bin" -name "$1")"
          echo "$(basename $file)"
        }

        echo "OSXCROSS_TARGET_DIR=${OSXCROSS_FOLDER}/target" >> $GITHUB_ENV
        echo "OSXCROSS_SDK_DIR=${OSXCROSS_FOLDER}/tarballs" >> $GITHUB_ENV
        echo "OSXCROSS_SDK=${OSXCROSS_FOLDER}/tarballs/MacOSX${{ inputs.osx-version }}.sdk" >> $GITHUB_ENV
        echo "OSXCROSSVER=${{ inputs.osx-version }}" >> $GITHUB_ENV
        echo "OSXCROSS_CCTOOLS_PATH=${OSXCROSS_FOLDER}/target/bin" >> $GITHUB_ENV
        echo "OSXCROSS_TARGET=arm64" >> $GITHUB_ENV
        echo "CMAKE_TOOLCHAIN_FILE=${OSXCROSS_FOLDER}/target/toolchain.cmake" >> $GITHUB_ENV